name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          # GitHub's macOS runners are often capacity-constrained; a missing
          # runner or slow queue shouldn't fail the whole run.
          - os: macos-latest
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Headless tests need a real Aseprite install, so CI runs unit tests only.
      - run: npm run test:unit
      - run: npm run build:extension
      - run: npm run build:mcpb
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: |
            dist/aseprite.mcpb
            dist/claude-bridge.aseprite-extension
